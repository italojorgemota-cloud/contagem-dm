<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1C5A0D">
<title>Contagem de Inventário</title>
<style>
/* Layout: cabeçalho verde fixo com "Ao vivo" e usuário, abas com ícones, cards claros arredondados; operador em celular com barra de envio e navegação inferior. */
:root{
  --bg:#E8F2E4; --bg2:#F6FAF3; --surface:#FFFFFF; --surface2:#F2F8EF; --ink:#17321C; --muted:#5C7262; --line:#D9E7D3;
  --brand:#1C5A0D; --brand2:#2F7F15; --brand-ink:#FFFFFF; --live:#34C21F; --live-soft:#DDF5D6;
  --accent:#2F7F15; --accent-soft:#E1F1DA;
  --ok:#1E7A12; --ok-soft:#E0F4D9; --warn:#B3741B; --warn-soft:#FBEFD2; --bad:#C0352B; --bad-soft:#FBE1DD;
  --shadow:0 1px 2px rgba(23,50,28,.06),0 8px 22px rgba(23,50,28,.07);
  --f:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif; --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --stick:56px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1A10; --bg2:#122216; --surface:#15251A; --surface2:#1B2E20; --ink:#E4F1E3; --muted:#9DB5A2; --line:#284030;
  --brand:#134508; --brand2:#1F6B10; --live:#4FD33B; --live-soft:#1B3A20; --accent:#79D65F; --accent-soft:#1E3A22;
  --ok:#79D65F; --ok-soft:#1B3A20; --warn:#E3B24C; --warn-soft:#3D3110; --bad:#F2897B; --bad-soft:#46201B; --shadow:none; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1A10; --bg2:#122216; --surface:#15251A; --surface2:#1B2E20; --ink:#E4F1E3; --muted:#9DB5A2; --line:#284030;
  --brand:#134508; --brand2:#1F6B10; --live:#4FD33B; --live-soft:#1B3A20; --accent:#79D65F; --accent-soft:#1E3A22;
  --ok:#79D65F; --ok-soft:#1B3A20; --warn:#E3B24C; --warn-soft:#3D3110; --bad:#F2897B; --bad-soft:#46201B; --shadow:none; color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg) linear-gradient(160deg,var(--bg2),var(--bg) 60%);background-attachment:fixed;color:var(--ink);font:14px/1.45 var(--f);-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--brand)}
button,input,select{font:inherit;color:inherit}
[hidden]{display:none!important}
.num,.mono{font-variant-numeric:tabular-nums}
.mono{font-family:var(--mono)}

/* cabeçalho */
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:30}
.hbar{background:linear-gradient(90deg,var(--brand),var(--brand2));color:var(--brand-ink)}
.hbar .in{display:flex;align-items:center;gap:10px;min-height:56px;padding-block:8px}
.logo{width:30px;height:30px;border-radius:8px;background:#fff;display:grid;place-items:center;flex:none}
.logo svg{width:20px;height:20px}
.ttl{font-weight:700;font-size:16px;line-height:1.15;min-width:0}
.sp{flex:1}
.live{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;background:rgba(255,255,255,.18);font-size:11.5px;font-weight:700;white-space:nowrap}
.live i{width:8px;height:8px;border-radius:50%;background:#58E03F;box-shadow:0 0 0 3px rgba(88,224,63,.28)}
.live.off{background:rgba(255,200,80,.25)}.live.off i{background:#F6B93B;box-shadow:0 0 0 3px rgba(246,185,59,.3)}
.uchip{display:inline-flex;align-items:center;gap:8px;padding:3px 10px 3px 4px;border-radius:999px;background:rgba(255,255,255,.16);font-size:12.5px;white-space:nowrap;max-width:46vw;overflow:hidden}
.uchip .nm{overflow:hidden;text-overflow:ellipsis}
.uchip a,.uchip button{color:#fff;text-decoration:underline;background:none;border:0;padding:0;cursor:pointer;font-size:12px}
.av{width:26px;height:26px;border-radius:50%;display:inline-grid;place-items:center;background:#fff;color:var(--brand);font-weight:800;font-size:11px;flex:none}
.tabbar{background:var(--surface);border-bottom:1px solid var(--line)}
.tabs{display:flex;gap:0 2px;flex-wrap:wrap}
.tab{appearance:none;border:0;background:none;padding:12px 11px;cursor:pointer;color:var(--muted);font-weight:700;font-size:13px;white-space:nowrap;border-bottom:3px solid transparent;display:flex;align-items:center;gap:6px}
.tab[aria-selected="true"]{color:var(--brand2);border-bottom-color:var(--live)}
:root[data-theme="dark"] .tab[aria-selected="true"]{color:var(--accent)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .tab[aria-selected="true"]{color:var(--accent)}}
.badge{min-width:18px;padding:1px 6px;border-radius:999px;background:var(--bad);color:#fff;font-size:11px;font-weight:700;text-align:center}
.wrap{max-width:1680px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.main{padding-block:16px 40px}
.stack{display:flex;flex-direction:column;gap:14px}

/* peças */
h2{font-size:17px;margin:0;font-weight:800}
.sub{color:var(--muted);font-size:12.5px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);min-width:0}
.card>.hd{display:flex;align-items:center;gap:10px;padding:14px 16px 4px;flex-wrap:wrap}
.card>.bd{padding:12px 16px 16px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,400px),1fr));gap:14px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,170px),1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:12px 14px;min-width:0}
.kpi .l{font-size:10.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.kpi .v{font-size:26px;font-weight:800;line-height:1.2;margin-top:2px}
.kpi .v.g{color:var(--ok)}.kpi .v.r{color:var(--bad)}.kpi .v.a{color:var(--warn)}
.kpi .s{font-size:11.5px;color:var(--muted);margin-top:2px}
.btn{appearance:none;border:1px solid var(--line);background:var(--surface);padding:9px 14px;border-radius:10px;cursor:pointer;font-weight:700;font-size:13px;min-height:38px}
.btn:hover{border-color:var(--brand2)}
.btn:focus-visible,.tab:focus-visible,input:focus-visible,select:focus-visible,.nv:focus-visible{outline:3px solid var(--live);outline-offset:1px}
.btn.primary{background:var(--brand2);border-color:var(--brand2);color:#fff}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.sm{min-height:30px;padding:4px 12px;font-size:12px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.chip{display:inline-block;padding:2px 9px;border-radius:999px;font-size:11px;font-weight:700;background:var(--surface2);color:var(--muted);white-space:nowrap}
.chip.ok{background:var(--ok-soft);color:var(--ok)}.chip.warn{background:var(--warn-soft);color:var(--warn)}.chip.bad{background:var(--bad-soft);color:var(--bad)}.chip.info{background:var(--accent-soft);color:var(--accent)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:700;background:var(--live-soft);color:var(--ok)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}.pill.gray{background:var(--surface2);color:var(--muted)}
.prog{height:10px;background:var(--surface2);border:1px solid var(--line);border-radius:999px;overflow:hidden}
.prog>b{display:block;height:100%;background:linear-gradient(90deg,var(--brand2),var(--live))}
.prog.split{display:flex}.prog.split>b{height:100%;background:none}
.scroll{overflow-x:auto}
table.tbl{width:100%;border-collapse:collapse;font-size:12.5px}
.tbl th{font-size:10.5px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);text-align:left;padding:9px 10px;background:var(--surface2);white-space:nowrap}
.tbl th:first-child{border-radius:10px 0 0 10px}.tbl th:last-child{border-radius:0 10px 10px 0}
.tbl td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl .r{text-align:right}
.tbl td.wc{min-width:170px}
.pos{color:var(--ok)}.neg{color:var(--bad)}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:11px;font-weight:800;letter-spacing:.04em;color:var(--muted)}
input[type=text],input[type=number],input[type=search],select{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 11px;min-height:38px;min-width:0;max-width:100%}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.filters .btn[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--brand2);color:var(--brand2)}
.empty{padding:26px 16px;text-align:center;color:var(--muted)}
.note{padding:10px 12px;border-left:4px solid var(--warn);background:var(--warn-soft);font-size:13px;border-radius:0 10px 10px 0}
.note.bad{border-color:var(--bad);background:var(--bad-soft)}.note.info{border-color:var(--brand2);background:var(--accent-soft)}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(88px + env(safe-area-inset-bottom,0px));z-index:60;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;max-width:92vw}
.toast{background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;box-shadow:0 4px 18px rgba(0,0,0,.25)}
.drop{border:2px dashed var(--line);border-radius:14px;padding:22px;text-align:center;background:var(--surface2)}

/* equipe ao vivo e feed */
.person{display:flex;align-items:center;gap:12px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.person .pav{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:12px;background:var(--surface2);color:var(--muted);border:2px solid var(--line);flex:none}
.person.on .pav{background:var(--live-soft);color:var(--ok);border-color:var(--live)}
.person .nm{font-weight:700}
.person .big{margin-left:auto;text-align:right;flex:none}
.person .big b{font-size:20px;display:block;line-height:1}
.person .big .g{color:var(--ok);font-weight:700;font-size:11px;display:block}.person .big .sub{display:block}
.feed{display:flex;flex-direction:column}
.feed .ev{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:12.5px}
.feed .ev:last-child{border-bottom:0}
.feed .tm{color:var(--muted);flex:none;font-variant-numeric:tabular-nums}

/* operador */
.items{display:flex;flex-direction:column;gap:8px}
.sec{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--stick));z-index:5;padding:6px 10px;background:var(--surface2);border-radius:8px;font-size:11.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.it{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 10px;align-items:center;padding:10px 12px;background:var(--surface);border:1.5px solid var(--line);border-radius:12px}
.it .tags{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.tag{padding:1px 8px;border-radius:999px;background:var(--surface2);color:var(--muted);font:600 11px var(--mono)}
.rd{display:inline-block;width:fit-content;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:800;background:var(--surface2);color:var(--muted)}
.rd.n2{background:var(--live-soft);color:var(--ok)}.rd.n3{background:var(--warn-soft);color:var(--warn);box-shadow:inset 0 0 0 1.5px var(--warn)}.rd.n4{background:var(--bad-soft);color:var(--bad);box-shadow:inset 0 0 0 1.5px var(--bad)}
.it[data-n="3"]{border-left:5px solid var(--warn)}.it[data-n="4"]{border-left:5px solid var(--bad)}
.wg{border:1px solid var(--line);border-radius:12px;margin-top:10px;overflow:hidden}.wg>.wh{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 12px;background:var(--surface2)}.wg .gr{border-top:1px solid var(--line);padding:8px 12px}.wg .gh,.wg>.wh{display:grid;grid-template-columns:minmax(0,1fr) 200px 200px;gap:10px 14px;align-items:center}.wg .gl{display:flex;gap:10px;align-items:center;flex-wrap:wrap;min-width:0}.wg .gh .field,.wg>.wh .field{width:100%}.wg .gh select,.wg>.wh select{width:100%}@media (max-width:760px){.wg .gh,.wg>.wh{grid-template-columns:1fr 1fr}.wg .gl,.wg>.wh>.nm{grid-column:1/-1}}.wg .nm{font-weight:800;flex:1;min-width:160px}.wg .tg{appearance:none;border:0;background:none;cursor:pointer;font-size:14px;padding:4px 6px}.wg table{margin-top:6px}.wg select{min-height:32px;padding:4px 8px;font-size:12.5px}.warnad{color:var(--warn);font-weight:700;font-size:12px}.sel-bar{position:sticky;top:calc(env(safe-area-inset-top,0px) + 100px);z-index:6}
.glist{display:flex;flex-direction:column;max-height:520px;overflow:auto;border:1px solid var(--line);border-radius:10px}.grow-item{display:flex;align-items:center;gap:10px;padding:8px 10px;border-bottom:1px solid var(--line);cursor:pointer;font-size:13px}.grow-item:last-child{border-bottom:0}.grow-item:hover{background:var(--surface2)}.grow-item .gn{flex:1;min-width:0;overflow-wrap:anywhere}.grow-item input{width:18px;height:18px;flex:none}
.rtile{display:flex;flex-direction:column;gap:2px;padding:10px 14px;border-radius:12px;background:var(--surface2);min-width:110px}.rtile b{font-size:22px;font-family:var(--f)}.rtile.n3{background:var(--warn-soft)}.rtile.n4,.rtile.sem{background:var(--bad-soft)}
.it .desc{font-weight:800;line-height:1.25;margin-top:3px}
.it .in{display:flex;align-items:center;gap:6px}
.it .un{font-size:11px;font-weight:700;color:var(--muted);width:26px}
.qty{width:92px;height:44px;border:2px solid var(--line);border-radius:10px;text-align:center;font:800 20px var(--f);background:var(--surface);padding:0 6px}
.it.has{border-color:#86CF74;background:var(--ok-soft)}
.it.has .qty{border-color:var(--brand2);color:var(--ok)}
.it .sent{display:none;align-items:center;gap:8px;font-weight:800;color:var(--ok);grid-column:1/-1}
.it.sentst{background:var(--ok-soft);border-color:#86CF74}
.it.sentst .in{display:none}.it.sentst .sent{display:flex}
.it .lnk{appearance:none;border:0;background:none;color:var(--brand2);text-decoration:underline;cursor:pointer;font-size:12px;padding:4px}
.sendbar{position:fixed;left:0;right:0;bottom:calc(var(--bn,0px) + env(safe-area-inset-bottom,0px));z-index:25;padding:8px max(12px,env(safe-area-inset-left,0px)) 8px max(12px,env(safe-area-inset-right,0px));pointer-events:none}
.sendbar .box{pointer-events:auto;max-width:620px;margin:0 auto;background:var(--surface);border:2px solid #86CF74;border-radius:14px;box-shadow:0 6px 24px rgba(0,0,0,.18);padding:10px 12px}
.sendbar .t{font-size:12.5px;margin-bottom:8px}
.sendbar .a{display:flex;gap:10px;align-items:center}
.sendbar .a .btn.primary{flex:1;min-height:44px;font-size:15px}
.sendbar .lim{background:none;border:0;font-weight:700;cursor:pointer;padding:8px}
.sync{display:flex;align-items:center;gap:10px;padding:9px 12px;font-size:13px;border-radius:12px;background:var(--surface);border:1px solid var(--line)}
.sync.off{background:var(--warn-soft);border-color:transparent}.sync.bad{background:var(--bad-soft);border-color:transparent}
.sync .grow{flex:1;min-width:0}
.sync .dot{width:9px;height:9px;border-radius:50%;background:var(--line);flex:none}.sync .dot.on{background:var(--live);box-shadow:0 0 0 3px var(--live-soft)}
.bnav.many .nv{font-size:9.5px;letter-spacing:-.2px}.bnav{position:fixed;left:0;right:0;bottom:0;z-index:26;background:var(--surface);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom,0px)}
.nv{flex:1;appearance:none;border:0;background:none;padding:8px 2px 7px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:700;color:var(--muted);cursor:pointer;position:relative}
.nv .ic{font-size:19px;line-height:1}
.nv[aria-selected="true"]{color:var(--brand2);background:var(--live-soft)}
.nv .badge{position:absolute;top:2px;left:calc(50% + 8px);font-size:10px;min-width:16px;padding:0 4px}
body.op .main{padding-bottom:210px;max-width:640px}
.shelf{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:14px 16px;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);cursor:pointer;min-height:64px}
.shelf:hover{border-color:var(--brand2)}
.shelf .t{font-weight:800;font-size:16px}
.shelf .c{margin-left:auto;text-align:right;white-space:nowrap}
.search{width:100%;min-height:42px}
.hero{font-size:24px;font-weight:800;line-height:1.15;margin:0}
.back{display:inline-flex;align-items:center;gap:6px;padding:4px 0;color:var(--brand2);font-weight:700;cursor:pointer;background:none;border:0}
/* acesso */
.pw{position:relative;display:block}.pw input{width:100%;padding-right:48px}.eye{position:absolute;right:2px;top:50%;transform:translateY(-50%);width:44px;height:44px;border:0;background:none;font-size:18px;cursor:pointer;opacity:.6;border-radius:8px}.eye[aria-pressed=true]{opacity:1}
.auth{min-height:100vh;display:grid;place-items:center;padding:24px max(16px,env(safe-area-inset-left,0px));background:var(--bg) linear-gradient(160deg,var(--bg2),var(--bg))}
.acard{width:100%;max-width:400px;background:var(--surface);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);padding:26px 22px;display:flex;flex-direction:column;gap:14px}
.biglogo{width:64px;height:64px;border-radius:16px;background:linear-gradient(135deg,var(--brand2),var(--live));display:grid;place-items:center}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pf{padding:10px 6px;border:2px solid var(--line);border-radius:12px;background:var(--surface);font-weight:700;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:13px;color:var(--ink)}
.pf[aria-pressed="true"]{border-color:var(--live);background:var(--live-soft);color:var(--ok)}
@media (min-width:1100px){table.tbl{font-size:13.5px}.tbl th{font-size:11px}.tbl td{padding:11px 12px}.tbl td.wc{min-width:280px}.grid2{grid-template-columns:repeat(auto-fit,minmax(min(100%,520px),1fr))}.kpis{grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr))}.tab{padding-left:16px;padding-right:16px}}
@media (max-width:640px){.ttl{font-size:14px;max-width:34vw}.uchip{max-width:40vw}.kpi .v{font-size:22px}}
@media (prefers-reduced-motion:no-preference){.prog>b{transition:width .4s ease}}
</style>
</head>
<body>

<div id="app"></div>
<div id="toast" aria-live="polite"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script>
/* ===== Camada Firebase: entrega ao app o mesmo "banco" que ele usava antes ===== */
(function(){
'use strict';
const CFG=window.FIREBASE_CONFIG||{};
if(CFG.teste){try{const b=document.createElement('div');b.id='envbanner';b.textContent='AMBIENTE DE TESTE · dados fictícios · este não é o sistema oficial';b.style.cssText='background:#E6A100;color:#1b1400;text-align:center;font:700 12px system-ui,sans-serif;padding:5px 8px;position:relative;z-index:50';document.body.insertBefore(b,document.body.firstChild);window.addEventListener('load',()=>{if(!/^\[TESTE\]/.test(document.title))document.title='[TESTE] '+document.title})}catch(e){}}
const root=()=>document.getElementById('app');
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const slug=s=>String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0,40)||'x';

      catch(e){
        if(!(e&&e.code==='auth/email-already-in-use'))throw e;

        try{const si=await a2.signInWithEmailAndPassword(email,pw);const k=await reg(si.user.uid);return k}catch(e2){}

function computeStats(){
  const st={total:0,counted:0,closed:0,rec2:0,rec3:0,rec4:0,openDiv:0,sem:0,pend:0,conf:0,okAll:0,c1n:0,c1ok:0,
    valTotal:0,valCounted:0,falta:0,sobra:0,provFalta:0,provSobra:0,absVal:0,noCost:0,
    shelves:new Map(),ops:new Map(),first:null,last:null,unasg:0,unasg2:0};
  const now=Date.now();
  for(const it of S.items.values()){
    if(!it.xo)st.total++;
    let sh=st.shelves.get(it.sk);if(!sh){sh={key:it.sk,name:it.shelf,total:0,counted:0,closed:0,div:0,rec:0,valErp:0};st.shelves.set(it.sk,sh)}
    if(!it.xo)sh.total++;
    const cost=it.cost||0;
    if(it.erp!=null){st.valTotal+=it.erp*cost;sh.valErp+=it.erp*cost}
    if(it.state==='pend'){st.pend++;continue}
    if(it.state==='rec2'||it.state==='rec3'||it.state==='rec4'){const a=thirdFor(it),w=(a&&a.k)||(it.state==='rec2'?assignee2(it):'');it.asg=w&&(w==='*'||eligible(it,w))?w:'';if(!it.asg){if(it.state==='rec2')st.unasg2++;else st.unasg++}}
    st.counted++;sh.counted++;
    if(it.cnt.length){st.c1n++;if(isErp(it,it.cnt[0].q))st.c1ok++}
    if(it.state==='closed'){st.closed++;sh.closed++;if(it.div){st.conf++;sh.div++}else st.okAll++}
    else{sh.rec++;st[it.state]++;if(it.pdiv||it.state==='sem')st.openDiv++}
    if(it.erp!=null){
      const q=it.state==='closed'?it.final:it.prov,diff=normQ(q-it.erp);
      it.diff=diff;it.vdiff=diff*cost;
      if(it.cost==null||it.cost===0)st.noCost++;
      st.valCounted+=it.erp*cost;st.absVal+=Math.abs(it.vdiff);
      if(diff!==0){
        if(it.state==='closed'){if(diff<0)st.falta+=-it.vdiff;else st.sobra+=it.vdiff}
        else{if(diff<0)st.provFalta+=-it.vdiff;else st.provSobra+=it.vdiff}
      }
    }
    it.cnt.forEach((c,i)=>{
      let o=st.ops.get(c.ok);if(!o){o={key:c.ok,name:c.op,n:0,first:c.t,last:c.t,hour:0,m15:0,c1n:0,c1ok:0,pend:0};st.ops.set(c.ok,o)}
      o.n++;if(now-c.t<900000)o.m15++;if(c.t<o.first)o.first=c.t;if(c.t>o.last)o.last=c.t;if(now-c.t<3600000)o.hour++;
      if(i===0){o.c1n++;if(isErp(it,c.q))o.c1ok++}
      if(st.first==null||c.t<st.first)st.first=c.t;if(st.last==null||c.t>st.last)st.last=c.t;
    });
  }
  st.acc1=st.c1n?st.c1ok/st.c1n*100:null;
  st.accFinal=st.closed?st.okAll/st.closed*100:null;
  st.accVal=st.valCounted>0?Math.max(0,(1-st.absVal/st.valCounted)*100):null;
  st.valDiv=st.falta+st.sobra+st.provFalta+st.provSobra;
  return st;
}

  const key=slug(name),u=S.users.get(key);let good=false;

  if(!good){lock.n++;if(lock.n>=5){lock.until=Date.now()+30000;lock.n=0}return{err:'Nome ou senha incorretos.'}}
  lock.n=0;

/* divergência = só entre as contagens (1ª a 4ª); o saldo do ERP não entra */
function dvKey(it){
  if(it.state==='pend')return it.reopened?'reab':null;
  if(it.state==='rec2'){const c=it.cnt[0];return c&&c.rnd===2?'f2':'f1'}
  if(it.state==='rec3'||it.state==='rec4'||it.state==='sem')return it.state;
  if(it.state==='closed'){const q=it.cnt.map(c=>normQ(c.q));if(it.manual)return'dec';if(q.some(x=>x!==q[0]))return'res'}
  return null;
}
function divItems(){return[...S.items.values()].filter(it=>dvKey(it))}
const DV_ORD={sem:0,rec4:1,rec3:2,f1:3,f2:4,reab:5,dec:6,res:7};
function divChip(it){
  const k=dvKey(it);

  return'<span class="chip ok">✓ Resolvida: '+fmtQ(it.final)+'</span><div class="sub">duas contagens iguais</div>';

/* ============ Locais: armazém > grupo > produtos ============ */
function locTree(){
  const t=new Map(),q=(S.q.lq||'').trim().toLowerCase();
  for(const it of S.items.values()){
    if(q&&!(it.code+' '+it.desc+' '+(it.grp||'')).toLowerCase().includes(q))continue;
    const wn=whOf(it),wk=slug(wn);let w=t.get(wk);if(!w){w={k:wk,name:wn,groups:new Map(),n:0,done:0};t.set(wk,w)}
    const gn=it.grp||'(Sem grupo)',gk=slug(it.grp||'sem-grupo');let g=w.groups.get(gk);if(!g){g={k:gk,name:gn,items:[],done:0,noAddr:0,key:'g:'+wk+'~'+gk};w.groups.set(gk,g)}
    g.items.push(it);w.n++;if(it.state!=='pend'){g.done++;w.done++}if(!hasAddr(it))g.noAddr++;
  }
  return[...t.values()].sort((a,b)=>a.name.localeCompare(b.name,'pt',{numeric:true}));
}

const SIT={reab:'Recontagem solicitada',ok:'Conforme',conf:'Divergência confirmada',rec2:'Em apuração (aguarda 2ª)',rec3:'Em apuração (aguarda 3ª)',rec4:'Em apuração (aguarda 4ª)',sem:'Sem consenso (decisão do supervisor)',pend:'Não contado'};
function itemRow(it){
  const k=statusKey(it),q=it.state==='closed'?it.final:it.prov;
  const diff=it.erp!=null&&q!=null?normQ(q-it.erp):null;
  return{codigo:it.code,desc:it.desc,un:it.un,prat:it.shelf,sec:it.sec,erp:it.erp,final:it.state==='closed'?it.final:(q==null?null:q),
    dif:diff,tipo:diff==null||diff===0?'':(diff<0?'Falta':'Sobra'),custo:it.cost,valor:diff==null?null:diff*(it.cost||0),
    c1:it.cnt[0]?it.cnt[0].q:null,c2:it.cnt[1]?it.cnt[1].q:null,c3:it.cnt[2]?it.cnt[2].q:null,c4:it.cnt[3]?it.cnt[3].q:null,ncont:it.cnt.length,
    quem:it.cnt.slice(0,4).map(c=>c.op).join(' / '),sit:SIT[k],k,provisoria:it.state!=='closed'&&it.state!=='pend'};
}
function topDiv(n){return[...S.items.values()].filter(it=>it.state==='closed'&&it.div).map(itemRow).sort((a,b)=>Math.abs(b.valor||0)-Math.abs(a.valor||0)).slice(0,n)}

  const sh=[...st.shelves.values()].sort((a,b)=>a.name.localeCompare(b.name,'pt',{numeric:true}));
  const ops=[...st.ops.values()].sort((a,b)=>b.n-a.n);
  h+='<div class="grid2"><div class="card"><div class="hd"><h2>Por prateleira</h2></div><div class="scroll"><table class="tbl"><thead><tr><th>Prateleira</th><th class="r">Itens</th><th class="r">Divergentes</th><th class="r">Acurácia</th></tr></thead><tbody>'+

  return h;

function mkSheet(rows,cols){
  const ws=XLSX.utils.aoa_to_sheet([cols.map(c=>c.h)].concat(rows.map(r=>cols.map(c=>{const v=r[c.k];return v==null?'':v}))));
  ws['!cols']=cols.map(c=>({wch:c.w||14}));
  cols.forEach((c,j)=>{if(c.z)for(let i=1;i<=rows.length;i++){const a=XLSX.utils.encode_cell({r:i,c:j});if(ws[a]&&typeof ws[a].v==='number')ws[a].z=c.z}});
  if(rows.length)ws['!autofilter']={ref:XLSX.utils.encode_range({s:{r:0,c:0},e:{r:rows.length,c:cols.length-1}})};
  return ws;
}
const IP_TXT='Propriedade intelectual: Italo Santos';
function stampXlsx(wb){
  wb.Props=Object.assign({},wb.Props,{Author:'Italo Santos',Creator:'Italo Santos',Company:'Propriedade intelectual: Italo Santos'});
  for(const n of wb.SheetNames){
    const ws=wb.Sheets[n];if(!ws||!ws['!ref'])continue;
    const r=XLSX.utils.decode_range(ws['!ref']),row=r.e.r+2;
    ws[XLSX.utils.encode_cell({r:row,c:0})]={t:'s',v:IP_TXT};
    r.e.r=row;ws['!ref']=XLSX.utils.encode_range(r);
  }
}
function saveXlsx(wb,filename){
  if(!S.dl){toast('Download indisponível nesta visualização');return}
  stampXlsx(wb);
  const out=XLSX.write(wb,{type:'array',bookType:'xlsx'});
  S.dl.save({filename,data:new Blob([out],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'})}).then(()=>toast('Arquivo salvo')).catch(e=>{if(!e||e.code!=='declined')toast('Não foi possível salvar o arquivo')});
}

/* ============ Grupo Produtos ============ */
const NOGRP='(Sem grupo)';
const GALIAS={
  gdesc:['descricaogrupo','descricaodogrupo','denominacaogrupo','denominacaodogrupo','nomegrupo','nomedogrupo','descgrupo','descrgrupo','denomgrupo','descricaogrupomercadoria','descricaogrupodemercadorias'],
  grp:['grupo','grupodemercadorias','grupomercadorias','grupomercadoria','grupodemercadoria','grmercadoria','grpmerc','grupomaterial','grupodemateriais','grupodoproduto','grupoproduto','grupodeproduto','familia','categoria','classe','tipo'],
  get code(){return ALIAS.code},get desc(){return ALIAS.desc},get un(){return ALIAS.un},get qty(){return ALIAS.qty}
};
function gAutoMap(headers){
  const H=headers.map(normH),used=new Set(),map={};
  for(const f of ['gdesc','grp','code','desc','un','qty']){
    let idx=-1;
    for(const a of GALIAS[f]){idx=H.findIndex((h,i)=>!used.has(i)&&h===a);if(idx>=0)break}
    if(idx<0)for(const a of GALIAS[f]){if(a.length<4)continue;idx=H.findIndex((h,i)=>!used.has(i)&&h.includes(a));if(idx>=0)break}
    if(idx>=0){used.add(idx);map[f]=idx}
  }
  return map;
}
function gDetect(aoa){
  const all=new Set(Object.values(GALIAS).flat());let best=0,bs=0;
  for(let i=0;i<Math.min(25,aoa.length);i++){const sc=(aoa[i]||[]).filter(c=>all.has(normH(c))).length;if(sc>bs){bs=sc;best=i}}
  return bs>=2?best:detectHeader(aoa);
}
function gParse(g){
  const aoa=g.sheets[g.sheet]||[],m=g.map,items=[],seen=new Set();
  const cell=(row,i)=>i==null||i===''?'':String(row[i]==null?'':row[i]).trim();
  for(let r=g.hdr+1;r<aoa.length;r++){
    const row=aoa[r]||[];
    const code=cell(row,m.code);if(!code)continue;
    const key=code;if(seen.has(key))continue;seen.add(key);
    const gc=cell(row,m.grp),gd=cell(row,m.gdesc);
    const grp=(gc&&gd&&gc!==gd?gc+' — '+gd:(gd||gc))||NOGRP;
    const qn=m.qty!=null&&m.qty!==''?toNum(row[m.qty]):NaN;
    items.push({q:isFinite(qn)?qn:null,c:code.slice(0,30),d:(cell(row,m.desc)||code).slice(0,120),g:grp.slice(0,80),u:cell(row,m.un).slice(0,8)});
  }
  g.items=items;
  g.sel=g.sel||new Set();
  const gs=new Set(items.map(x=>x.g));[...g.sel].forEach(k=>{if(!gs.has(k))g.sel.delete(k)});
}
function gSave(){
  try{if(S.grp)store.set('ci:grp',JSON.stringify({file:S.grp.file,t:S.grp.t,items:S.grp.items}));else store.set('ci:grp','')}catch(e){}
}

function gStart(sheets,fileName){

/* ============ Endereçamento (base de endereços × estoque do ERP) ============ */
function aAutoMap(headers){
  const H=headers.map(normH),used=new Set(),map={};
  const AL={code:ALIAS.code,shelf:['endereco','enderecamento','prateleira','estante','rua','localizacao','local','posicao','deposito','corredor','area'],sec:['secao','sessao','nivel','vao','gaveta','box','coluna','andar','bin']};
  for(const f of ['code','shelf','sec']){
    let idx=-1;
    for(const a of AL[f]){idx=H.findIndex((h,i)=>!used.has(i)&&h===a);if(idx>=0)break}
    if(idx<0)for(const a of AL[f]){if(a.length<4)continue;idx=H.findIndex((h,i)=>!used.has(i)&&h.includes(a));if(idx>=0)break}
    if(idx>=0){used.add(idx);map[f]=idx}
  }
  return map;
}
function aParse(a){
  const aoa=a.sheets[a.sheet]||[],m=a.map,rows=[],seen=new Set();let dups=0,semEnd=0;
  const cell=(r,i)=>i==null||i===''?'':String(r[i]==null?'':r[i]).trim();
  for(let i=a.hdr+1;i<aoa.length;i++){
    const r=aoa[i]||[],code=cell(r,m.code);if(!code)continue;
    const shelf=cell(r,m.shelf);if(!shelf){semEnd++;continue}
    if(seen.has(code)){dups++;continue}seen.add(code);
    rows.push([code.slice(0,30),shelf.slice(0,40),cell(r,m.sec).slice(0,30)]);
  }
  a.rows=rows;a.dups=dups;a.semEnd=semEnd;
}
function aStart(sheets,fileName){
  const names=Object.keys(sheets).filter(n=>sheets[n].length>1);
  if(!names.length){toast('A planilha está vazia');return}
  const a={file:fileName,sheets,names,sheet:names[0]};
  aSetSheet(a,a.sheet);S.aend=a;
}
function aSetSheet(a,n){a.sheet=n;a.hdr=gDetect(a.sheets[n]);aRemap(a)}
function aRemap(a){a.map=aAutoMap(a.sheets[a.sheet][a.hdr]||[]);aParse(a)}
async function aSave(){
  const a=S.aend;if(!a||!a.rows.length||a.busy)return;
  a.busy=true;draw(true);
  try{
    for(const id of [...S.addrDocs.keys()])await S.db.doc('addr/'+id).delete();
    for(let i=0,n=0;i<a.rows.length;i+=500,n++)await S.db.doc('addr/'+addrId(n)).set({no:n,rows:a.rows.slice(i,i+500)});
    await S.db.doc('addr/meta').set({file:a.file,t:Date.now(),count:a.rows.length});
    S.aend=null;toast('Base de endereços salva: '+fmtN(a.rows.length)+' códigos');
  }catch(e){console.error(e);a.busy=false;a.err='Não foi possível salvar ('+((e&&e.code)||'erro')+(e&&e.message?': '+String(e.message).slice(0,160):'')+') [v3]'}
  draw(true);
}
async function aDelete(){
  if(!confirmOnce('adelbase')){toast('Toque de novo para excluir toda a base de endereços',4000);return}
  try{for(const id of [...S.addrDocs.keys()])await S.db.doc('addr/'+id).delete();S.aend=null;toast('Base de endereços excluída')}
  catch(e){console.error(e);toast('Não foi possível excluir a base ('+((e&&e.code)||'erro')+')',4000)}
}
async function addrSet(code,shelf,sec){
  const docs=[...S.addrDocs.entries()].filter(([k])=>k!=='meta').sort((x,y)=>x[0]<y[0]?-1:1);
  for(const [id,dd] of docs){const i=(dd.rows||[]).findIndex(r=>r[0]===code);if(i>=0){const rows=dd.rows.slice();rows[i]=[code,shelf,sec];await S.db.doc('addr/'+id).set({no:dd.no,rows});return}}
  const last=docs[docs.length-1];
  if(last&&last[1].rows.length<500)await S.db.doc('addr/'+last[0]).set({no:last[1].no,rows:last[1].rows.concat([[code,shelf,sec]])});
  else await S.db.doc('addr/'+addrId(docs.length)).set({no:docs.length,rows:[[code,shelf,sec]]});
}
const addrTxt=a=>a?a.shelf+(a.sec?' / '+a.sec:''):'';
function stockBase(){
  if(S.imp&&S.imp.all&&S.imp.all.length)return S.imp.all.map(x=>({c:x.code,d:x.desc,g:x.grp||'',q:x.qty,u:x.un}));
  if(S.meta&&S.items.size)return[...S.items.values()].map(it=>({c:it.code,d:it.desc,g:it.grp||'',q:it.erp==null?null:it.erp,u:it.un}));

const stockSrc=()=>S.imp&&S.imp.all&&S.imp.all.length?'produtos do arquivo em Importar':'produtos do inventário publicado';
function endRows(){

    if(a)out.com.push({c:x.c,d:x.d,g:x.g,q:x.q,end:addrTxt(a),u:x.u});
    else if(x.q==null||x.q>0)out.sem.push({c:x.c,d:x.d,g:x.g,q:x.q,end:'',u:x.u});
  }
  if(stockBase().length)for(const [c,a] of S.addr)if(!seen.has(c))out.orf.push({c,d:'',g:'',q:null,end:addrTxt(a),u:''});
  return out;
}
function endFiltered(){

}

function vEnd0(){

  let h='';

/* ============ Apuração (lançamento da controladoria × contagem) ============ */
S.apur=new Map();S.apend=null;
const apId=n=>'c'+String(n).padStart(3,'0');
const AP_ALIAS={
  get code(){return ALIAS.code},
  qty:['qtdfinal','quantidadefinal','qtdapurada','quantidadeapurada','quantidadelancada','qtdlancada','qtdelancada','lancado','qtdcontabil','saldocontabil','saldoatual','saldoestoque','saldofisico','saldo','estoqueatual','estoque','quantidade','qtd','qtde'],
  get cost(){return ALIAS.cost.concat(['valorunitarior','valorunitario'])}
};
const AP_W={a:{t:'1ª base — Inventário enviado à controladoria',d:'o arquivo gerado na aba Controladoria (coluna Qtd. final), como foi enviado para lançamento'},b:{t:'2ª base — Sistema após o lançamento',d:'o relatório de saldo do sistema depois que a controladoria lançou o inventário'}};
function apAutoMap(headers){
  const H=headers.map(normH),used=new Set(),map={};
  const AL={code:AP_ALIAS.code,qty:AP_ALIAS.qty,cost:AP_ALIAS.cost,desc:ALIAS.desc};
  for(const f of ['code','qty','cost','desc']){
    let idx=-1;
    for(const a of AL[f]){idx=H.findIndex((h,i)=>!used.has(i)&&h===a);if(idx>=0)break}
    if(idx<0&&f!=='qty')for(const a of AL[f]){if(a.length<4)continue;idx=H.findIndex((h,i)=>!used.has(i)&&h.includes(a));if(idx>=0)break}
    if(idx>=0){used.add(idx);map[f]=idx}
  }
  return map;
}
function apParse(a){
  const aoa=a.sheets[a.sheet]||[],m=a.map,acc=new Map();let bad=0,dups=0;
  const cell=(r,i)=>i==null||i===''?'':r[i]==null?'':r[i];
  for(let i=a.hdr+1;i<aoa.length;i++){
    const r=aoa[i]||[],code=String(cell(r,m.code)).trim();if(!code||/^total$/i.test(code)||/^propriedade/i.test(code))continue;
    const q=toNum(cell(r,m.qty));if(!isFinite(q)){bad++;continue}
    const c=m.cost!=null&&m.cost!==''?toNum(cell(r,m.cost)):NaN;
    const d=m.desc!=null&&m.desc!==''?String(cell(r,m.desc)).trim().slice(0,80):'';
    let x=acc.get(code);
    if(x){dups++;x.q=normQ(x.q+q);if(isFinite(c))x.c=c;if(d&&!x.d)x.d=d}else acc.set(code,{q:normQ(q),c:isFinite(c)?c:null,d});
  }
  a.rows=[...acc.entries()].map(([code,x])=>[code.slice(0,30),x.q,x.c,x.d]);a.bad=bad;a.dups=dups;
}
function apStart(w,sheets,fileName){
  const names=Object.keys(sheets).filter(n=>sheets[n].length>1);
  if(!names.length){toast('A planilha está vazia');return}
  const a={w,file:fileName,sheets,names,sheet:names[0]};
  apSetSheet(a,a.sheet);S.apend=a;
}
function apSetSheet(a,n){a.sheet=n;a.hdr=detectHeader(a.sheets[n]);apRemap(a)}
function apRemap(a){a.map=apAutoMap(a.sheets[a.sheet][a.hdr]||[]);apParse(a)}
const apIsChunk=(id,w)=>new RegExp('^'+w+'\\d+$').test(id);
const apIds=w=>[...S.apur.keys()].filter(k=>apIsChunk(k,w));
const apMeta=w=>S.apur.get('m'+w)||null;
async function apDelAll(w){
  for(const id of apIds(w))await S.db.doc('apur/'+id).delete();
  if(S.apur.has('m'+w))await S.db.doc('apur/m'+w).delete();
}
async function apSave(){
  const a=S.apend;if(!a||!a.rows.length||a.busy)return;
  a.busy=true;draw(true);
  try{
    for(const id of [...S.apur.keys()])if(!/^[ab]\d+$|^m[ab]$/.test(id))await S.db.doc('apur/'+id).delete();
    await apDelAll(a.w);
    for(let i=0,n=0;i<a.rows.length;i+=400,n++)await S.db.doc('apur/'+a.w+String(n).padStart(3,'0')).set({no:n,rows:a.rows.slice(i,i+400)});
    await S.db.doc('apur/m'+a.w).set({file:a.file,t:Date.now(),count:a.rows.length,inv:S.meta?S.meta.inv:'',op:S.name,cost:a.rows.some(r=>r[2]!=null)});
    S.apend=null;toast('Base salva: '+fmtN(a.rows.length)+' códigos');
  }catch(e){console.error(e);a.busy=false;a.err='Não foi possível salvar ('+((e&&e.code)||'erro')+')'}
  draw(true);
}
async function apClear(w){
  if(!confirmOnce('apclr'+w)){toast('Toque de novo para apagar esta base',3500);return}
  try{await apDelAll(w);toast('Base apagada')}catch(e){toast('Não foi possível apagar')}
}
function apBase(w){
  const m=new Map();
  apIds(w).sort().forEach(id=>(S.apur.get(id).rows||[]).forEach(r=>{
    const o=m.get(r[0]);if(o){o.q=normQ(o.q+r[1]);if(r[2]!=null)o.c=r[2];if(!o.d&&r[3])o.d=r[3]}else m.set(r[0],{q:r[1],c:r[2]==null?null:r[2],d:r[3]||''});
  }));
  return m;
}
/* Situações: ok conforme · div quantidade diferente · nl enviado e sem saldo no sistema · ns no sistema e fora do enviado */
const AP_TXT={ok:'✓ Conforme',div:'Divergente',nl:'Enviado, não lançado',ns:'No sistema, não enviado'};
const AP_CHIP={ok:'ok',div:'bad',nl:'warn',ns:'warn'};
function apRows(){
  const A=apBase('a'),B=apBase('b'),out=[],grp=new Map();
  for(const it of S.items.values())if(!grp.has(it.code))grp.set(it.code,{g:it.grp||'',d:it.desc,u:it.un});
  const codes=new Set([...A.keys(),...B.keys()]);
  for(const code of codes){
    const a=A.get(code),b=B.get(code),g=grp.get(code)||{};
    let st,diff;
    if(a&&b){diff=normQ(b.q-a.q);st=diff===0?'ok':'div'}
    else if(a){if(a.q===0)st='ok';else st='nl';diff=normQ(0-a.q)}
    else{if(b.q===0)continue;st='ns';diff=b.q}
    const cost=(b&&b.c!=null)?b.c:(a&&a.c!=null?a.c:null);
    out.push({code,desc:(a&&a.d)||(b&&b.d)||g.d||'',grp:g.g||'',un:g.u||'',st,env:a?a.q:null,sis:b?b.q:null,diff,cost,vd:cost!=null?Math.round(diff*cost*100)/100:null});
  }
  return out.sort((x,y)=>String(x.code).localeCompare(String(y.code),'pt',{numeric:true}));
}
function apFiltered(rows){
  const f=S.q.apf||'div',g=S.q.apg||'',q=(S.q.apq||'').trim().toLowerCase();
  let l=rows;
  if(f==='problemas')l=l.filter(r=>r.st!=='ok');
  else if(f==='falta')l=l.filter(r=>r.diff<0);
  else if(f==='sobra')l=l.filter(r=>r.diff>0);
  else if(f!=='todos')l=l.filter(r=>r.st===f);
  if(g)l=l.filter(r=>(r.grp||NOGRP)===g);
  if(q)l=l.filter(r=>(r.code+' '+r.desc).toLowerCase().includes(q));
  return l;
}
function apTotals(rows){
  const t={ok:0,div:0,nl:0,ns:0,falta:0,sobra:0,semCusto:0};
  for(const r of rows){
    t[r.st]++;
    if(r.vd!=null){if(r.vd<0)t.falta+=-r.vd;else t.sobra+=r.vd}
    else if(r.diff!==0)t.semCusto++;
  }
  t.liq=Math.round((t.sobra-t.falta)*100)/100;t.falta=Math.round(t.falta*100)/100;t.sobra=Math.round(t.sobra*100)/100;
  return t;
}
function apBody(rows){
  const l=apFiltered(rows);
  if(!l.length)return'<tr><td colspan="8" class="empty">Nenhum item nesta situação.</td></tr>';
  const q=v=>v==null?'<span class="sub">—</span>':fmtQ(v);
  return l.slice(0,300).map(r=>'<tr><td class="mono">'+esc(r.code)+'</td><td class="wc">'+esc(r.desc)+'</td><td class="sub">'+esc(r.grp)+'</td><td class="num" style="text-align:center">'+q(r.env)+'</td><td class="num" style="text-align:center">'+q(r.sis)+'</td><td class="num" style="text-align:center"><b class="'+(r.diff>0?'pos':r.diff<0?'neg':'')+'">'+(r.diff>0?'+':'')+fmtQ(r.diff)+'</b></td><td class="num" style="text-align:center">'+(r.vd==null?'<span class="sub">—</span>':'<span class="'+(r.vd>0?'pos':r.vd<0?'neg':'')+'">'+fmtR(r.vd)+'</span>')+'</td><td><span class="chip '+AP_CHIP[r.st]+'">'+AP_TXT[r.st]+'</span></td></tr>').join('')+(l.length>300?'<tr><td colspan="8" class="sub" style="text-align:center">Mostrando 300 de '+fmtN(l.length)+'. A exportação traz todos.</td></tr>':'');
}

    '<div class="sub">'+esc(n.d)+'.</div>'+

    '<div class="row"><label class="btn'+(m?'':' primary')+'">'+(m?'Trocar arquivo':'Enviar arquivo')+'<input type="file" id="apfile-'+w+'" accept=".xlsx,.xls,.csv,.txt" data-chg="apfile" data-w="'+w+'" style="display:none"></label>'+(m?'<button class="btn danger sm" data-act="apclear" data-w="'+w+'">Apagar</button>':'')+'</div></div></div>';
}

/* ============ Varredura de endereçamento (coletores endereçam produtos sem endereço) ============ */
S.atask=new Map();S.anew=new Map();S.al={dev:'',list:[]};S.adpre={};
const adKey=()=>'ci:ad:'+S.dev;
function adLocal(){
  if(S.al.dev!==S.dev){let l=[];try{l=JSON.parse(store.get(adKey())||'[]')}catch(e){}S.al={dev:S.dev,list:Array.isArray(l)?l.filter(e=>e.s===0||Date.now()-e.t<172800000):[]}}
  return S.al.list;
}
const adPersist=()=>store.set(adKey(),JSON.stringify(S.al.list));
const adPending=()=>adLocal().filter(e=>e.s===0);
let adRetry=null;
async function flushAd(){
  if(S.adflushing||!S.db||!S.name)return;
  const un=adPending();if(!un.length)return;
  S.adflushing=true;updateSync();
  try{
    for(const e of un){
      await withTimeout(S.db.doc('addrnew/'+e.id).set({code:e.code,desc:e.desc,grp:e.grp,shelf:e.shelf,nf:!!e.nf,op:e.op,ok:e.ok,t:e.t}),20000);
      e.s=1;adPersist();
    }
    S.adErr=null;S.lastSync=Date.now();
  }catch(err){S.adErr={code:(err&&err.code)||'erro',message:String((err&&err.message)||err||'')}}
  finally{S.adflushing=false;updateSync();clearTimeout(adRetry);if(adPending().length&&S.online)adRetry=setTimeout(flushAd,8000)}
}
const adMeta=()=>{const m=S.atask.get('meta');return m&&m.on?m:null};
function adRows(){
  const out=[];
  [...S.atask.entries()].filter(([k])=>/^t\d+$/.test(k)).sort((a,b)=>a[0]<b[0]?-1:1).forEach(([,d])=>(d.rows||[]).forEach(r=>out.push(r)));
  return out;
}
/* só conta como feito o que está no banco ou ainda na fila de envio; cópias locais já enviadas não valem (senão o item não volta ao ser desfeito pelo gestor) */
function adDone(){const s=new Set();for(const d of S.anew.values())s.add(d.code);for(const e of adLocal())if(e.s===0)s.add(e.code);return s}
const adAsg=()=>{const d=S.atask.get('assign');return(d&&d.map)||{}};
const adGrp=r=>r[2]||NOGRP;
/* linhas liberadas que o usuário atual pode ver: o gestor vê todas; o coletor só os grupos atribuídos a ele (ou a "todos") */
function adVisible(){
  const rows=adRows();if(S.isAdmin)return rows;
  const a=adAsg(),k=myKey();
  return rows.filter(r=>{const w=a[adGrp(r)];return w==='*'||w===k});
}
function adMissing(){if(!adMeta())return[];const done=adDone();return adVisible().filter(r=>!done.has(r[0]))}

const adInp=(code,v)=>'<div class="adrow row" style="gap:8px;align-items:center;width:100%"><div class="field" style="flex:1;min-width:150px"><input type="text" data-adin list="adl" autocomplete="off" autocapitalize="characters" placeholder="Ex.: A-12 / 03" value="'+esc(v||'')+'" aria-label="Endereço de '+esc(code)+'"></div></div>';
function adCard(r){const pre=(S.adpre[r[0]]||'').split(' | ').filter(Boolean);return'<div class="card" data-ad="'+esc(r[0])+'"><div class="bd stack"><div><span class="tag c">'+esc(r[0])+'</span>'+(r[2]?' <span class="tag s">'+esc(r[2])+'</span>':'')+'</div><div class="desc"><b>'+esc(r[1])+'</b></div><div class="sub" style="margin-bottom:-6px">ENDEREÇO</div><div class="adins stack" style="gap:8px">'+(pre.length?pre.map(v=>adInp(r[0],v)).join(''):adInp(r[0],''))+'</div><div class="row"><button class="btn sm" data-act="adadd" type="button">+ Mesmo item em outro endereço</button><button class="btn sm danger" data-act="adnf" type="button">Produto não encontrado</button><span class="sp" style="flex:1"></span><button class="btn primary" data-act="adsave" style="min-height:44px;min-width:110px">Salvar</button></div></div></div>'}
function adSync(l,miss){
  const host=$('#alist');if(!host)return;
  const missSet=new Set(miss.map(r=>r[0]));
  let removed=0;
  host.querySelectorAll('[data-ad]').forEach(c=>{
    if(!missSet.has(c.dataset.ad)){
      if(c.contains(document.activeElement))toast('Esse produto acabou de ser endereçado por outra pessoa',3500);
      c.remove();removed++;
    }
  });
  const have=new Set([...host.querySelectorAll('[data-ad]')].map(c=>c.dataset.ad));
  let n=have.size;
  for(const r of l){if(n>=40)break;if(!have.has(r[0])){host.insertAdjacentHTML('beforeend',adCard(r));n++}}
  const empty=host.querySelector('.empty');
  if(!n&&!empty)host.innerHTML='<div class="card"><div class="empty">'+((S.q.aq||'').trim()?'Nada encontrado para essa busca.':adEmptyTxt())+'</div></div>';
  else if(n&&empty&&empty.closest('.card')&&!empty.closest('[data-ad]'))empty.closest('.card').remove();
}
function adNf(b){
  const card=b.closest('[data-ad]');if(!card)return;
  const code=card.dataset.ad;
  if(!confirmOnce('adnf'+code)){toast('Toque de novo para confirmar: produto não encontrado',3500);return}
  const r=adRows().find(x=>x[0]===code);
  adLocal().unshift({id:adId(code),code,desc:r?r[1]:'',grp:r?r[2]:'',shelf:'PRODUTO NÃO LOCALIZADO',nf:1,op:S.name,ok:myKey(),t:Date.now(),s:0});

}

function adMineList(){

function adSave(b){

function adStats(){
  const rows=adRows(),codes=new Set(rows.map(r=>r[0])),es=[...S.anew.values()].sort((a,b)=>b.t-a.t),by=new Map(),d0=new Date();d0.setHours(0,0,0,0);
  let done=0,nf=0;
  for(const e of es){
    if(codes.has(e.code)){if(e.nf)nf++;else done++}
    let o=by.get(e.ok);if(!o){o={key:e.ok,nf:0,name:e.op,n:0,first:e.t,last:e.t,today:0};by.set(e.ok,o)}
    if(e.nf)o.nf=(o.nf||0)+1;else o.n++;if(e.t<o.first)o.first=e.t;if(e.t>o.last)o.last=e.t;if(e.t>=d0.getTime())o.today++;
  }
  return{total:rows.length,done,nf,es,by:[...by.values()].sort((a,b)=>b.n-a.n)};
}

function adAssignCounts(){
  const asg=adAsg(),done=adDone(),m=new Map();
  for(const r of adRows()){
    const w=asg[adGrp(r)];if(!w)continue;
    let o=m.get(w);if(!o){o={n:0,d:0};m.set(w,o)}
    o.n++;if(done.has(r[0]))o.d++;
  }
  return m;
}
function adCollTable(st){
  const ac=adAssignCounts(),by=new Map(st.by.map(o=>[o.key,o])),keys=new Set([...by.keys(),...ac.keys()]);
  if(!keys.size)return'';
  const nm=k=>k==='*'?'Todos os coletores (grupos compartilhados)':((by.get(k)||{}).name||(knownOps().find(o=>o.key===k)||{}).name||k);
  const rows=[...keys].map(k=>({k,name:nm(k),o:by.get(k),a:ac.get(k)||{n:0,d:0}})).sort((x,y)=>y.a.n-x.a.n||(y.o?y.o.n:0)-(x.o?x.o.n:0));
  const tot=rows.reduce((s,r)=>s+r.a.n,0);
  return'<div class="scroll"><table class="tbl"><thead><tr><th>Coletor</th><th style="text-align:center">Itens atribuídos</th><th style="text-align:center">Endereçados</th><th style="text-align:center">Hoje</th><th>Primeiro</th><th>Último</th><th style="text-align:center">Ritmo (itens/h)</th></tr></thead><tbody>'+rows.map(r=>{const o=r.o,hrs=o?(o.last-o.first)/3600000:0,rt=o&&o.n>=2&&hrs>0?o.n/hrs:null,pend=Math.max(0,r.a.n-r.a.d);return'<tr><td><b>'+esc(r.name)+'</b></td><td class="num" style="text-align:center"><b>'+fmtN(r.a.n)+'</b>'+(r.a.n?'<div class="sub">faltam '+fmtN(pend)+'</div>':'')+'</td><td class="num" style="text-align:center">'+fmtN(o?o.n:0)+'</td><td class="num" style="text-align:center">'+fmtN(o?o.today:0)+'</td><td>'+(o?fmtDT(o.first):'<span class="sub">—</span>')+'</td><td>'+(o?fmtDT(o.last):'<span class="sub">—</span>')+'</td><td class="num" style="text-align:center">'+(rt==null?'<span class="sub">—</span>':fmtN(rt,1))+'</td></tr>'}).join('')+'</tbody></table></div><div class="sub">Itens atribuídos = produtos dos grupos escolhidos para cada coletor (total '+fmtN(tot)+'). "Faltam" desconta o que já foi endereçado ou marcado como não localizado. Ritmo = endereços ÷ horas entre o primeiro e o último lançamento.</div>';
}

async function adRelease(){
  if(!stockBase().length){toast('Envie o arquivo do ERP na aba Importar primeiro',3500);return}
  const done=adDone(),running=!!adMeta(),prev=running?adRows():[],have=new Set(prev.map(r=>r[0]));
  /* varredura em andamento: mantém a lista atual (inclusive o que já foi endereçado) e só acrescenta produtos novos */
  const add=endRows().sem.filter(x=>!done.has(x.c)&&!have.has(x.c)).map(x=>[String(x.c).slice(0,30),String(x.d||'').slice(0,70),String(x.g||'').slice(0,40),String(x.u||'').slice(0,8)]);
  const rows=prev.concat(add);
  if(!rows.length){toast('Nenhum produto sem endereço para liberar');return}
  if(running&&!add.length){toast('Lista já está atualizada: nenhum produto novo. O andamento da varredura foi mantido.',4000);return}
  try{
    const ids=new Set();
    for(let i=0,n=0;i<rows.length;i+=300,n++){const id='t'+String(n).padStart(3,'0');ids.add(id);await S.db.doc('addrtask/'+id).set({no:n,rows:rows.slice(i,i+300)})}
    for(const id of [...S.atask.keys()])if(/^t\d+$/.test(id)&&!ids.has(id))await S.db.doc('addrtask/'+id).delete();
    const cur=S.atask.get('meta')||{};
    await S.db.doc('addrtask/meta').set({on:true,t:Date.now(),count:rows.length,by:S.name,since:(running&&cur.since)||(running&&cur.t)||Date.now()});
    toast(running?('Lista atualizada: +'+fmtN(add.length)+' produto(s) novo(s); o andamento foi mantido'):('Lista liberada: '+fmtN(rows.length)+' produtos'));
  }catch(e){console.error(e);toast('Não foi possível liberar a lista',3500)}
}
async function adStop(){
  if(!confirmOnce('adstop')){toast('Toque de novo para encerrar a varredura (os endereços coletados são mantidos)',4000);return}
  try{
    for(const id of [...S.atask.keys()])if(/^t\d+$/.test(id))await S.db.doc('addrtask/'+id).delete();
    await S.db.doc('addrtask/meta').set({on:false,t:Date.now(),count:0,by:S.name});
    toast('Varredura encerrada');
  }catch(e){toast('Não foi possível encerrar')}
}

const qMeta=()=>{const m=S.atask.get('qmeta');return m&&m.on?m:null};
const qn=s=>String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
const qc=s=>qn(s).replace(/[^a-z0-9]/g,'');
function qBuild(){
  const seen=new Set(),out=[];
  for(const x of stockBase()){seen.add(x.c);const a=S.addr.get(x.c);out.push([String(x.c).slice(0,30),String(x.d||'').slice(0,90),String(x.g||'').slice(0,40),a?addrTxt(a).slice(0,100):''])}
  for(const [c,a] of S.addr)if(!seen.has(c))out.push([String(c).slice(0,30),'','',addrTxt(a).slice(0,100)]);
  return out;
}
let _qi=null;
function qIndex(){
  const local=S.canEdit&&S.addr.size&&stockBase().length;
  const sig=[S.atask,S.anew,local?S.addr:null,local?S.items.size:0,local&&S.imp?S.imp.all:null];
  if(_qi&&_qi.sig.every((v,i)=>v===sig[i]))return _qi.list;
  let rows=[];
  if(local)rows=qBuild();
  else[...S.atask.entries()].filter(([k])=>/^q\d+$/.test(k)).sort((a,b)=>a[0]<b[0]?-1:1).forEach(([,d])=>(d.rows||[]).forEach(r=>rows.push(r)));
  const m=new Map();
  for(const r of rows)m.set(String(r[0]),{c:String(r[0]),d:r[1]||'',g:r[2]||'',end:r[3]||''});
  if(!local)for(const d of S.anew.values()){
    if(d.nf)continue;
    const e=m.get(String(d.code));
    if(e){if(!e.end)e.end=d.shelf||''}else m.set(String(d.code),{c:String(d.code),d:d.desc||'',g:d.grp||'',end:d.shelf||''});
  }
  const list=[...m.values()].map(e=>Object.assign(e,{n:qn(e.d),k:qc(e.d),nc:qn(e.c)}));
  _qi={sig,list};return list;
}
function qSearch(text){
  const toks=qn(text).split(/\s+/).filter(Boolean);
  if(!toks.length||toks.join('').length<2)return null;
  const res=[];
  for(const e of qIndex()){
    let sc=0,ok=true;
    for(const t of toks){
      const tc=t.replace(/[^a-z0-9]/g,'');
      if(e.n.includes(t)||(tc&&e.k.includes(tc))||e.nc.includes(t)){if((' '+e.n).includes(' '+t)||e.nc===t)sc++}else{ok=false;break}
    }
    if(ok)res.push([sc,e]);
  }
  res.sort((a,b)=>b[0]-a[0]||a[1].d.localeCompare(b[1].d,'pt',{numeric:true}));
  return res.map(x=>x[1]);
}
function qCard1(e){

function blMerge(l){
  const out=[],g={},hasK={1:false,2:false},lg={1:false,2:false};
  for(const c of l)if(c.k)hasK[roundOfShelf(c.k)]=true;
  for(const c of l){

      /* sem prateleira = contagem antiga (1ª/2ª) ou recontagem (3ª/4ª): só vira parte da 1ª/2ª se essa rodada ainda não tem contagem por prateleira */
      r=1;while(r<=2&&(hasK[r]||lg[r]))r++;

}

  for(let r=hdr+1;r<aoa.length;r++){
    const row=aoa[r]||[],code=String(row[map.code]==null?'':row[map.code]).trim();if(!code||seen.has(zc(code)))continue;seen.add(zc(code));
    const desc=map.desc!=null?String(row[map.desc]==null?'':row[map.desc]).trim():'';if(!desc)semDesc++;
    const un=map.un!=null?String(row[map.un]==null?'':row[map.un]).trim().slice(0,6):'';
    const gc=map.grp!=null?String(row[map.grp]==null?'':row[map.grp]).trim():'',gd=map.gdesc!=null?String(row[map.gdesc]==null?'':row[map.gdesc]).trim():'';
    rows.push([code.slice(0,30),(desc||code).slice(0,100),un,((gc&&gd&&gc!==gd?gc+' — '+gd:(gd||gc))||'').slice(0,40)]);
  }
  if(!rows.length){toast('Nenhum produto encontrado na planilha');return}
  S_cp={name:f.name,rows,semDesc,hasDesc:map.desc!=null,hasUn:map.un!=null};
}

const XPH=[null,null];
function compressImg(file,max=720,q=0.55){
  return new Promise((res,rej)=>{
    const fr=new FileReader();
    fr.onerror=rej;
    fr.onload=()=>{const im=new Image();im.onerror=rej;im.onload=()=>{
      const r=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');
      c.width=Math.max(1,Math.round(im.width*r));c.height=Math.max(1,Math.round(im.height*r));
      c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',q))};im.src=fr.result};
    fr.readAsDataURL(file);
  });
}

/* ============ Resumo por local (prateleira, armário...) no Endereçamento ============ */
const LS_TIPOS={P:'Prateleira',AR:'Armário'};
function lsParse(shelf){
  const raw=String(shelf||'').trim().toUpperCase();
  const m=raw.match(/^([A-ZÀ-Ý]+)\s*[-_./ ]?\s*0*(\d+)/);
  if(m)return{key:m[1]+m[2],let:m[1]};
  const first=raw.split(/[-\/]/)[0].trim()||'(sem endereço)',l=(first.match(/^[A-ZÀ-Ý]+/)||['?'])[0];
  return{key:first,let:l};
}
const lsTipo=l=>LS_TIPOS[l]||('Tipo '+l);
function lsData(){
  const base=stockBase(),gm=new Map(base.map(x=>[zc(x.c),x.g||''])),bm=new Map(base.map(x=>[zc(x.c),x]));
  const hasStock=base.length>0,locs=new Map();let semGrupo=0;
  const cp=cpIndex();
  for(const [code,a] of S.addr){
    const z=zc(code);let g=gm.get(z)||'';
    if(!g){const r=cp.get(z);if(r&&r.grp)g=r.grp}
    if(!g){g='(Sem grupo)';semGrupo++}
    const p=lsParse(a.shelf);
    let L=locs.get(p.key);if(!L){L={key:p.key,let:p.let,n:0,g:new Map(),gp:new Map()};locs.set(p.key,L)}
    L.n++;L.g.set(g,(L.g.get(g)||0)+1);
    const b=bm.get(z),r=cp.get(z);let arr=L.gp.get(g);if(!arr){arr=[];L.gp.set(g,arr)}
    arr.push({c:String(code),d:(b&&b.d)||(r&&r.desc)||'',q:b?b.q:null,u:(b&&b.u)||(r&&r.un)||'',end:addrTxt(a)});
  }
  const list=[...locs.values()].sort((x,y)=>x.let.localeCompare(y.let,'pt')||x.key.localeCompare(y.key,'pt',{numeric:true}));
  return{list,semSaldo:0,semGrupo,hasStock};
}
function lsFiltered(D){
  const t=S.q.lst||'',q=(S.q.lsq||'').trim().toLowerCase();
  return D.list.filter(L=>(!t||L.let===t)&&(!q||L.key.toLowerCase().includes(q)||[...L.g.keys()].some(g=>g.toLowerCase().includes(q))));
}
function lsGrp(L,g,n){
  const ps=(L.gp.get(g)||[]).slice().sort((x,y)=>String(x.c).localeCompare(String(y.c),'pt',{numeric:true}));
  return'<details class="lsg"><summary><span class="chip" style="margin:2px 4px 2px 0;cursor:pointer">'+esc(g)+' · '+n+' ▾</span></summary>'+
    '<table class="tbl" style="margin:4px 0 8px"><thead><tr><th>Código</th><th>Descrição</th><th>Endereço</th><th class="r">Qtd. ERP</th></tr></thead><tbody>'+
    ps.map(p=>'<tr><td class="mono">'+esc(p.c)+'</td><td class="wc">'+esc(p.d||'—')+'</td><td class="sub">'+esc(p.end)+'</td><td class="r num">'+(p.q==null?'<span class="sub">—</span>':fmtQ(p.q)+(p.u?' '+esc(p.u):''))+'</td></tr>').join('')+'</tbody></table></details>';
}
function lsBody(D){
  const l=lsFiltered(D);
  if(!l.length)return'<tr><td colspan="5" class="empty">Nenhum local encontrado.</td></tr>';
  return l.map(L=>{const gs=[...L.g.entries()].sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0],'pt',{numeric:true}));
    return'<tr><td><b>'+esc(L.key)+'</b></td><td>'+esc(lsTipo(L.let))+'</td><td class="r num">'+fmtN(L.n)+'</td><td class="r num">'+gs.length+'</td><td class="wc">'+gs.map(([g,n])=>lsGrp(L,g,n)).join('')+'</td></tr>'}).join('');
}
function locSumCard(){
  if(!S.addr.size)return'';
  const D=lsData(),tipos=[...new Set(D.list.map(L=>L.let))];
  const tot=t=>{const l=D.list.filter(L=>L.let===t);return{n:l.length,p:l.reduce((a,L)=>a+L.n,0),g:new Set(l.flatMap(L=>[...L.g.keys()])).size}};

/* ============ calculadora inteligente (só no usuário do coletor) ============ */
const CALC={open:false,tab:'calc',expr:'',res:null,rows:[{n:'Caixa',q:'',p:''}],av:'',dv:'',dp:'',mv:'',mf:'kg',mt:'g',tgt:null};
const CALC_UN={
  'Massa':{kg:1000,g:1,mg:.001,t:1e6},
  'Comprimento':{km:1000,m:1,cm:.01,mm:.001},
  'Volume':{L:1,mL:.001,'m³':1000},
  'Quantidade':{'unidade':1,'dúzia':12,'meia dúzia':6,'centena':100,'milheiro':1000}
};
const calcFm=n=>(n==null||!isFinite(n))?'':String(Math.round(n*1e6)/1e6).replace('.',',');
const calcNum=v=>{const s=String(v==null?'':v).trim().replace(/\./g,'').replace(',','.');if(s==='')return NaN;return Number(s)};
function calcEval(e){
  const t=String(e).replace(/,/g,'.').match(/\d+(?:\.\d+)?|\.\d+|[+\-×÷]/g);if(!t)return null;
  const a=[];let neg=false;
  for(let i=0;i<t.length;i++){const x=t[i];
    if(/^[+\-×÷]$/.test(x)){
      if(x==='-'&&(a.length===0||typeof a[a.length-1]==='string')){neg=!neg;continue}
      if(a.length===0||typeof a[a.length-1]==='string')continue;
      a.push(x);
    }else{a.push(neg?-Number(x):Number(x));neg=false}
  }
  while(a.length&&typeof a[a.length-1]==='string')a.pop();
  if(!a.length)return null;
  const b=[a[0]];
  for(let i=1;i<a.length;i+=2){const op=a[i],v=a[i+1];
    if(op==='×')b[b.length-1]*=v;else if(op==='÷'){if(v===0)return NaN;b[b.length-1]/=v}else{b.push(op);b.push(v)}}
  let r=b[0];for(let i=1;i<b.length;i+=2)r=b[i]==='+'?r+b[i+1]:r-b[i+1];
  return Math.round(r*1e9)/1e9;
}
function calcKey(k){
  const C=CALC;
  if(k==='C'){C.expr='';C.res=null}
  else if(k==='⌫'){C.expr=C.expr.slice(0,-1);C.res=null}
  else if(k==='='){const r=calcEval(C.expr);C.res=r==null?null:r;if(r!=null&&isFinite(r))C.expr=calcFm(r)}
  else if(k==='%'){const m=C.expr.match(/(\d+(?:,\d+)?)$/);if(m){C.expr=C.expr.slice(0,-m[1].length)+calcFm(Number(m[1].replace(',','.'))/100);C.res=null}}
  else if(/^[+\-×÷]$/.test(k)){
    if(C.expr===''&&k!=='-')return;
    if(/[+\-×÷]$/.test(C.expr)){if(k==='-'&&/[×÷]$/.test(C.expr))C.expr+=k;else C.expr=C.expr.slice(0,-1)+k}
    else C.expr+=k;
    C.res=null}

function calcValue(){
  const C=CALC;
  if(C.tab==='calc'){const r=C.res!=null?C.res:calcEval(C.expr);return(r==null||!isFinite(r))?null:r}

function calcEmbTotal(){
  let t=0,any=false;
  for(const r of CALC.rows){const q=calcNum(r.q),p=calcNum(r.p);if(isFinite(q)&&isFinite(p)){t+=q*p;any=true}}
  const av=calcNum(CALC.av);if(isFinite(av)){t+=av;any=true}
  return any?Math.round(t*1e6)/1e6:null;
}
function calcMed(){
  const v=calcNum(CALC.mv);if(!isFinite(v))return null;
  const g=Object.values(CALC_UN).find(o=>CALC.mf in o&&CALC.mt in o);if(!g)return null;
  return Math.round(v*g[CALC.mf]/g[CALC.mt]*1e9)/1e9;
}
function calcTabs(){return[['calc','🧮 Calculadora'],['emb','📦 Caixas e pacotes'],['med','📏 Medidas']].map(([k,l])=>'<button class="clt" data-ck="'+k+'" aria-selected="'+(CALC.tab===k)+'">'+l+'</button>').join('')}

  }

/* ============ leitura de QR code pela câmera (preenche o código do produto) ============ */
const QRS={stream:null,raf:0,busy:false,det:null,last:0};
function qrCandidates(text){
  const t=String(text||'').trim(),out=[],add=x=>{x=String(x||'').trim();if(x&&!out.includes(x))out.push(x)};
  const runs=t.match(/\d{4,}/g)||[];
  add(t.replace(/^[^:=]*[:=]\s*/,''));
  runs.forEach(r=>add(r));
  runs.forEach(r=>{if(r.length>10){add(r.slice(-10));add(r.slice(0,10));if(r.length>12)add(r.slice(-12))}});
  t.split(/[^A-Za-z0-9]+/).forEach(add);
  return out;
}
function qrResolve(text){
  for(const c of qrCandidates(text)){const it=blFindCode(c);if(it)return{code:it.code,it}}
  return null;
}
function qrJsq(cv,cx,sx,sy,sw,sh,max){
  const k=Math.min(1,max/Math.max(sw,sh)),w=Math.max(1,Math.round(sw*k)),h=Math.max(1,Math.round(sh*k));
  cv.width=w;cv.height=h;cx.drawImage(QRS.src,sx,sy,sw,sh,0,0,w,h);
  const d=cx.getImageData(0,0,w,h),r=window.jsQR(d.data,w,h,{inversionAttempts:'attemptBoth'});return r?(r.data||''):'';
}
/* tenta a imagem inteira, o centro ampliado e um recorte menor, em resolução alta (o QR das etiquetas costuma ser pequeno) */
function qrDecodeSrc(src,W,H,cv,cx,mode){
  QRS.src=src;const m=Math.min(W,H);
  if(mode===0)return qrJsq(cv,cx,0,0,W,H,1000);
  if(mode===1){const s=Math.round(m*.7);return qrJsq(cv,cx,Math.round((W-s)/2),Math.round((H-s)/2),s,s,900)}
  const s=Math.round(m*.5);return qrJsq(cv,cx,Math.round((W-s)/2),Math.round((H-s)/2),s,s,700);
}
function qrDecodeVideo(v,cv,cx,mode){return qrDecodeSrc(v,v.videoWidth,v.videoHeight,cv,cx,mode)}
async function qrPhoto(file){
  if(!file)return;
  toast('Lendo a foto…');
  try{
    await qrLoadLib();
    const url=URL.createObjectURL(file),img=new Image();
    await new Promise((ok,no)=>{img.onload=ok;img.onerror=no;img.src=url});
    const W=img.naturalWidth,H=img.naturalHeight,cv=document.createElement('canvas'),cx=cv.getContext('2d',{willReadFrequently:true});
    let txt='';
    for(const mode of [0,1,2]){txt=qrDecodeSrc(img,W,H,cv,cx,mode);if(txt)break}
    if(!txt&&'BarcodeDetector' in window){try{const r=await new BarcodeDetector({formats:['qr_code']}).detect(img);if(r&&r.length)txt=r[0].rawValue||''}catch(e){}}
    URL.revokeObjectURL(url);
    if(txt){if(navigator.vibrate)try{navigator.vibrate(60)}catch(e){}qrDone(txt)}
    else toast('Não consegui ler o QR na foto. Chegue mais perto, com boa luz, e tente de novo.',5000);
  }catch(e){toast('Não foi possível ler a foto',4000)}
}
function qrStop(){
  if(QRS.raf)cancelAnimationFrame(QRS.raf);QRS.raf=0;
  if(QRS.stream){QRS.stream.getTracks().forEach(t=>t.stop());QRS.stream=null}
  const o=$('#qrov');if(o)o.remove();
}
function qrDone(text){
  qrStop();
  const inp=$('#blcode'),res=$('#blres');if(!inp)return;
  const hit=qrResolve(text);
  if(hit){inp.value=hit.code;blSearch();toast('QR lido: '+hit.code)}
  else{
    const run=(String(text).match(/\d{4,}/g)||[]).sort((a,b)=>b.length-a.length)[0]||'';
    inp.value=run;
    if(res)res.innerHTML='<div class="note warn"><b>Li o QR, mas não achei produto com ele.</b><br>Texto lido: <span class="mono">'+esc(String(text).slice(0,120))+'</span><br>Confira o código e toque em Buscar, ou digite o código do produto.</div>';
  }
}
function qrLoadLib(){
  return new Promise((ok,no)=>{
    if(window.jsQR)return ok();
    const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.min.js';
    s.onload=()=>ok();s.onerror=()=>no(new Error('lib'));document.head.appendChild(s);
  });
}
async function qrOpen(){
  if(!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia)){toast('Este aparelho ou navegador não permite usar a câmera aqui',4500);return}
  qrStop();
  const ov=document.createElement('div');ov.id='qrov';ov.setAttribute('role','dialog');ov.setAttribute('aria-label','Ler QR code');
  ov.innerHTML='<div class="qrbox"><div class="qrhd"><b>Aponte para o QR code</b><button class="clr" id="qrx" aria-label="Fechar">✕</button></div><div class="qrvw"><video id="qrv" playsinline muted autoplay></video><div class="qrfr"></div></div><div class="qrft" id="qrmsg">Abrindo a câmera…</div><div class="qrft"><label class="btn sm" style="display:inline-flex;align-items:center;gap:6px;cursor:pointer">📸 Não leu? Tirar foto do QR<input type="file" id="qrfile" accept="image/*" capture="environment" hidden></label></div></div>';
  document.body.appendChild(ov);
  $('#qrx').onclick=qrStop;
  $('#qrfile').onchange=e=>{const f=e.target.files&&e.target.files[0];e.target.value='';if(f){const ov=$('#qrov');qrPhoto(f)}};
  let stream;
  try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1920},height:{ideal:1080}},audio:false})}
  catch(e){qrStop();toast(e&&e.name==='NotAllowedError'?'Permita o uso da câmera no navegador para ler o QR':'Não foi possível abrir a câmera',5000);return}
  if(!$('#qrov')){stream.getTracks().forEach(t=>t.stop());return}
  QRS.stream=stream;const v=$('#qrv');v.srcObject=stream;try{await v.play()}catch(e){}
  try{const tr=stream.getVideoTracks()[0],cp=tr.getCapabilities?tr.getCapabilities():{};if(cp.focusMode&&cp.focusMode.includes('continuous'))await tr.applyConstraints({advanced:[{focusMode:'continuous'}]})}catch(e){}
  let det=null;
  if('BarcodeDetector' in window){try{det=new BarcodeDetector({formats:['qr_code']})}catch(e){det=null}}
  if(!det){try{await qrLoadLib()}catch(e){qrStop();toast('Não consegui carregar o leitor de QR. Verifique a internet.',5000);return}}
  const m=$('#qrmsg');if(m)m.textContent='Chegue perto e mantenha o QR dentro do quadro.';
  const cv=document.createElement('canvas'),cx=cv.getContext('2d',{willReadFrequently:true});
  const tick=async()=>{
    if(!QRS.stream)return;
    QRS.raf=requestAnimationFrame(tick);
    const now=performance.now();if(QRS.busy||now-QRS.last<120||v.readyState<2||!v.videoWidth)return;
    QRS.last=now;QRS.busy=true;
    try{
      let txt='';
      if(det){const r=await det.detect(v);if(r&&r.length)txt=r[0].rawValue||''}
      else{
        QRS.n=(QRS.n||0)+1;txt=qrDecodeVideo(v,cv,cx,QRS.n%3);
      }
      if(txt){QRS.busy=false;if(navigator.vibrate)try{navigator.vibrate(60)}catch(e){}qrDone(txt);return}
    }catch(e){}
    QRS.busy=false;
  };
  QRS.raf=requestAnimationFrame(tick);
}

function relGroups(){

      for(let i=0;i<sh.items.length;i+=CHUNK){
        no++;const part=sh.items.slice(i,i+CHUNK),items=[],erp={};
        part.forEach((x,k)=>{const id=no+'-'+k;items.push(Object.assign({i:id,c:x.code,d:x.desc,u:x.un,s:x.sec,h:hq(salt,id,x.qty)},x.wh?{w:x.wh}:{},x.grp?{g:x.grp}:{}));erp[id]=[x.qty,x.cost]});
        docs.push({no,chunk:{inv,no,sk,shelf:sh.name,items},erp:{inv,no,items:erp}});
      }
    }
    let done=0;const total=docs.length*2+1;
    for(const d of docs){
      await S.db.doc('chunks/'+inv+'_'+d.no).set(d.chunk);done++;imp.msg='Adicionando produtos ('+done+' de '+total+')';draw(true);
      await S.db.doc('erp/'+inv+'_'+d.no).set(d.erp);done++;imp.msg='Guardando saldos do ERP ('+done+' de '+total+')';draw(true);
    }
    await writeDoc(S.db.doc('meta/current'),{total:(Number(S.meta.total)||0)+nw.length,addedAt:Date.now()});
    S.imp=null;S.tab='dashboard';
    toast(fmtN(nw.length)+' produtos adicionados ao inventário. As contagens atuais foram mantidas.',5000);
  }catch(e){
    console.error(e);imp.busy=false;imp.err='Não foi possível adicionar ('+((e&&e.code)||'erro')+'). Nada do que já foi contado foi alterado. Tente de novo.';
  }
  if(S.imp)S.imp.busy=false;
  draw(true);
}

/* ===== card Equipe: quem está contando e quem está disponível ===== */
function teamData(){
  const now=Date.now(),shs=manualShelves(),isOp=k=>{const u=S.users&&S.users.get&&S.users.get(k);return !u||u.role==='op'};
  const ops=knownOps().filter(o=>o.key!=='*'&&isOp(o.key)).map(o=>{const h=S.hb.get(o.key)||{};return{key:o.key,name:o.name,online:!!(h.t&&now-h.t<300000),pending:Number(h.pending)||0,bl:h.bl||{}}});
  const byKey=new Map(ops.map(o=>[o.key,o]));
  const going=[];
  for(const sh of shs){
    const tm=teamOf(sh.key).filter(k=>k!=='*');if(!tm.length)continue;
    const mem=tm.map(k=>{const o=byKey.get(k)||{key:k,name:nameOfKey(k),online:false,pending:0,bl:{}};const x=o.bl[sh.key]||{n:0,c:0};return{o,n:x.n||0,c:!!x.c}});
    if(mem.every(m=>m.c))continue;
    going.push({sh,mem});
  }
  const busy=new Set();going.forEach(g=>g.mem.forEach(m=>{if(!m.c)busy.add(m.o.key)}));
  const free=ops.filter(o=>!busy.has(o.key)).map(o=>({o,done:shs.filter(sh=>teamOf(sh.key).includes(o.key)&&(o.bl[sh.key]||{}).c)}));
  return{going:going.sort((a,b)=>a.sh.name.localeCompare(b.sh.name,'pt',{numeric:true})||(a.sh.r2?1:0)-(b.sh.r2?1:0)),free:free.sort((a,b)=>(b.o.online-a.o.online)||a.o.name.localeCompare(b.o.name,'pt'))};
}

/* ===== Divergências: filtro por grupo ===== */
const _gc=x=>{const g=String(x||'').trim();const m=g.match(/^(\S+)\s+[—–-]\s+/);return m?m[1]:(/^\S+$/.test(g)?g:'')};
let _gcache={n:-1,m:null};
function grpCanon(g){
  if(!g)return g;
  if(_gcache.n!==S.items.size||!_gcache.m){const m=new Map();
    for(const it of S.items.values()){const c=_gc(it.grp);if(!c)continue;const o=m.get(c);if(!o||String(it.grp).length>o.length)m.set(c,String(it.grp).trim())}
    _gcache={n:S.items.size,m}}
  const c=_gc(g);return(c&&_gcache.m.get(c))||g;
}
const dvGrp=it=>it.grp?grpCanon(it.grp):(it.xo?'(Fora do estoque)':'(Sem grupo)');
function divGrpSelect(){
  const m=new Map();for(const it of divItems()){const g=dvGrp(it);m.set(g,(m.get(g)||0)+1)}
  const l=[...m.entries()].sort((a,b)=>a[0].localeCompare(b[0],'pt',{numeric:true}));
  if(S.q.dgrp&&!m.has(S.q.dgrp))S.q.dgrp='';
  return'<div class="field" style="min-width:220px"><label for="dgrp">GRUPO</label><select id="dgrp" data-chg="dgrp"><option value="">Todos os grupos</option>'+l.map(([g,n])=>'<option value="'+esc(g)+'"'+(S.q.dgrp===g?' selected':'')+'>'+esc(g)+' ('+n+')</option>').join('')+'</select></div>';
}

/* ============ Indicadores de desempenho da equipe ============ */
const IND_COL=['#2e7d32','#1976d2','#f57c00','#7b1fa2','#00838f','#c2185b','#5d4037','#455a64'];
const fmtDur=m=>m==null||!isFinite(m)?'–':(m<1?'<1 min':(m<60?Math.round(m)+' min':Math.floor(m/60)+'h'+String(Math.round(m%60)).padStart(2,'0')));
function indData(){
  const per=S.q.indper||'all',sel=S.q.indsh||'',t0=per==='today'?new Date().setHours(0,0,0,0):0;
  const rows=[];
  for(const it of S.items.values())it.cnt.forEach((c,i)=>{if(c.t>=t0)rows.push({it,c,n:i+1,sh:c.p||it.shelf||'—'})});
  const shelves=[...new Set(rows.map(r=>r.sh))].sort((a,b)=>a.localeCompare(b,'pt',{numeric:true}));
  const R=sel?rows.filter(r=>r.sh===sel):rows;
  /* por colaborador */
  const ops=new Map();
  for(const r of R){let o=ops.get(r.c.ok);if(!o){o={key:r.c.ok,name:r.c.op,n:0,first:0,ts:[],agree:0,agreeN:0,div:0,ghost:0};ops.set(r.c.ok,o)}
    o.n++;if(r.n===1)o.first++;o.ts.push(r.c.t);
    if(r.it.state==='closed'){o.agreeN++;if(normQ(r.c.q)===normQ(r.it.final))o.agree++}
    if(r.it.xo&&r.it.state==='closed'&&normQ(r.it.final)===0&&normQ(r.c.q)>0)o.ghost++}
  for(const o of ops.values()){
    o.ts.sort((a,b)=>a-b);let act=0,g=0;
    for(let i=1;i<o.ts.length;i++){const d=(o.ts[i]-o.ts[i-1])/60000;if(d<=10){act+=d;g++}}
    o.act=act;o.gaps=g;o.avg=g?act/g:null;o.rate=act>=1?o.n/(act/60):null;
    o.span=o.ts.length>1?(o.ts[o.ts.length-1]-o.ts[0])/60000:0;
  }
  /* por prateleira */
  const shm=new Map();
  for(const r of rows){let s=shm.get(r.sh);if(!s){s={name:r.sh,n:0,items:new Set(),ops:new Set(),t1:Infinity,t2:0};shm.set(r.sh,s)}
    s.n++;s.items.add(r.it.id);s.ops.add(r.c.op);s.t1=Math.min(s.t1,r.c.t);s.t2=Math.max(s.t2,r.c.t)}
  for(const s of shm.values()){let multi=0,dv=0,mx=0;
    for(const id of s.items){const it=S.items.get(id);if(it.cnt.length>=2){multi++;const q=it.cnt.map(c=>normQ(c.q)),lo=Math.min(...q),hi=Math.max(...q);if(hi!==lo){dv++;mx=Math.max(mx,(hi-lo)/Math.max(hi,1)*100)}}}
    s.multi=multi;s.dv=dv;s.mx=mx;s.span=(s.t2-s.t1)/60000}
  /* diferenças entre contagens */
  const seen=new Set(),diff=[];
  for(const r of R){if(seen.has(r.it.id))continue;seen.add(r.it.id);const it=r.it;if(it.cnt.length<2)continue;
    const q=it.cnt.map(c=>normQ(c.q)),lo=Math.min(...q),hi=Math.max(...q);if(hi===lo)continue;
    diff.push({it,sh:r.sh,lo,hi,sp:hi-lo,pct:(hi-lo)/Math.max(hi,1)*100})}
  diff.sort((a,b)=>b.pct-a.pct||b.sp-a.sp);
  /* contagens por hora */
  const hr=new Map(),opKeys=[...ops.keys()];
  for(const r of R){const h=new Date(r.c.t),k=h.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'})+' '+String(h.getHours()).padStart(2,'0')+'h';
    let b=hr.get(k);if(!b){b={k,t:new Date(h.getFullYear(),h.getMonth(),h.getDate(),h.getHours()).getTime(),by:{}};hr.set(k,b)}
    b.by[r.c.ok]=(b.by[r.c.ok]||0)+1}
  const hours=[...hr.values()].sort((a,b)=>a.t-b.t).slice(-36);
  return{rows,R,shelves,ops:[...ops.values()].sort((a,b)=>b.n-a.n),shm:[...shm.values()].sort((a,b)=>a.name.localeCompare(b.name,'pt',{numeric:true})),diff,hours,opKeys,sel,per};
}

/* ============ importação do ERP ============ */
const normH=s=>String(s==null?'':s).normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^a-z0-9]/g,'');
const FIELDS=[['code','Código do material'],['desc','Descrição'],['un','Unidade'],['qty','Saldo do ERP'],['cost','Custo unitário'],['shelf','Prateleira / endereço'],['sec','Seção'],['wh','Cód. armazém (opcional)'],['grp','Grupo (opcional)'],['gdesc','Descrição do grupo (opcional)']];
const ALIAS={
  code:['codigo','cod','codigomaterial','codigodomaterial','codmaterial','material','codproduto','codigoproduto','sku','item'],
  desc:['descricao','descricaodomaterial','descmaterial','descricaoitem','descricaoproduto','nome','produto','denominacao','textobreve'],
  un:['un','und','unid','unidade','um','unidademedida','unidadedemedida','unidadedoestoque'],
  qty:['saldo','saldoatual','saldoestoque','saldofisico','quantidade','qtd','qtde','qtdestoque','estoque','estoqueatual'],
  cost:['custo','custounitario','customedio','custounit','valorunitario','precomedio','preco','vlrunit','vlunitario','customedioun'],
  shelf:['prateleira','estante','rua','endereco','localizacao','local','area','corredor'],
  grp:['grupo','grupodemercadorias','grupomercadorias','grupomercadoria','grupodemercadoria','grmercadoria','grpmerc','grupomaterial','grupodemateriais','grupodoproduto','grupoproduto','grupodeproduto','familia','categoria','classe','tipo'],
  gdesc:['descricaogrupo','descricaodogrupo','denominacaogrupo','denominacaodogrupo','nomegrupo','nomedogrupo','descgrupo','descrgrupo','denomgrupo'],
  wh:['codigoarmazem','codarmazem','codigodoarmazem','codigoalmoxarifado','armazem','almoxarifado','deposito','centro','planta'],
  sec:['secao','sessao','nivel','posicao','vao','gaveta','box','coluna','bin','andar']
};
function autoMap(headers){
  const H=headers.map(normH),used=new Set(),map={};
  for(const f of ['gdesc','grp','code','desc','un','qty','cost','shelf','sec','wh']){
    let idx=-1;
    for(const a of ALIAS[f]){idx=H.findIndex((h,i)=>!used.has(i)&&h===a);if(idx>=0)break}
    if(idx<0)for(const a of ALIAS[f]){if(a.length<4)continue;idx=H.findIndex((h,i)=>!used.has(i)&&h.includes(a));if(idx>=0)break}
    if(idx>=0){used.add(idx);map[f]=idx}
  }
  return map;
}
function detectHeader(aoa){
  const all=new Set(Object.values(ALIAS).flat());let best=0,bs=0;
  for(let i=0;i<Math.min(25,aoa.length);i++){
    const sc=(aoa[i]||[]).filter(c=>all.has(normH(c))).length;
    if(sc>bs){bs=sc;best=i}
  }
  if(bs>=2)return best;
  for(let i=0;i<Math.min(25,aoa.length);i++)if((aoa[i]||[]).filter(c=>String(c).trim()!=='').length>=3)return i;
  return 0;
}
const toNum=v=>{
  if(typeof v==='number')return v;
  let s=String(v==null?'':v).replace(/R\$|\s/g,'');if(!s)return NaN;
  if(/,/.test(s)&&/\./.test(s))s=s.replace(/\./g,'').replace(',','.');else s=s.replace(',','.');
  return/^-?\d*\.?\d+$/.test(s)?Number(s):NaN;
};
function parseItems(imp){
  const aoa=imp.sheets[imp.sheet]||[],m=imp.map,out=[];let skipped=0,zero=0;
  const cell=(row,i)=>i==null||i===''?'':(row[i]==null?'':row[i]);
  for(let r=imp.hdr+1;r<aoa.length;r++){
    const row=aoa[r]||[];
    const code=String(cell(row,m.code)).trim();if(!code){skipped++;continue}
    const qty=toNum(cell(row,m.qty));if(!isFinite(qty)){skipped++;continue}
    if(qty<=0&&!imp.zero){zero++;continue}
    const cost=m.cost!=null&&m.cost!==''?toNum(cell(row,m.cost)):NaN;
    const code0=code;const ad=imp.useAddr!==false?S.addr.get(code):null;
    const shelf=(ad&&ad.shelf)||(m.shelf==='wh'?String(cell(row,m.wh)).trim():String(cell(row,m.shelf)).trim())||'Sem endereço';
    const gc=String(cell(row,m.grp)).trim(),gd=String(cell(row,m.gdesc)).trim();
    const grp=((gc&&gd&&gc!==gd?gc+' — '+gd:(gd||gc))||'').slice(0,80);
    out.push({code,desc:String(cell(row,m.desc)).trim().slice(0,120)||code,un:String(cell(row,m.un)).trim().slice(0,6),qty:Math.max(0,normQ(qty)),cost:isFinite(cost)?cost:0,shelf:shelf.slice(0,40),sec:(ad?ad.sec:String(cell(row,m.sec)).trim()).slice(0,30),hasAddr:!!ad,grp,wh:String(cell(row,m.wh)).trim().slice(0,30)});
  }
  imp.all=out;applyGsel(imp,skipped,zero);
}
function applyGsel(imp,skipped,zero){
  const out=imp.all||[],sel=imp.gsel;
  const items=sel&&sel.size?out.filter(x=>sel.has(x.grp||'(Sem grupo)')):out;
  const shelves=new Set(items.map(x=>slug(x.shelf)));
  const prev=imp.parsed||{};
  imp.parsed={items,skipped:skipped!=null?skipped:prev.skipped||0,zero:zero!=null?zero:prev.zero||0,shelves:shelves.size,val:items.reduce((a,x)=>a+x.qty*x.cost,0),noAddr:items.filter(x=>x.shelf==='Sem endereço').length,total:out.length};
}

function loadWorkbook(file){

    await S.db.doc('final/current').set({inv,items:{}});step('Preparando decisões');
    await S.db.doc('reset/current').set({inv,items:{}});step('Preparando recontagens');
    await S.db.doc('meta/current').set({inv,name:(imp.name||'Inventário').trim().slice(0,80),salt,status:'aberto',allowSame:false,createdAt:Date.now(),total:imp.parsed.items.length,file:imp.demo?'dados de exemplo':imp.fileName});step('Liberando para a equipe');
    imp.msg='Limpando o inventário anterior…';draw(true);
    await purge(inv);
    S.imp=null;S.tab='dashboard';S.opView={page:'locais',kind:'shelf',shelf:null};
    toast('Inventário publicado. A equipe já pode contar.',3500);
  }catch(e){
    console.error(e);imp.busy=false;imp.err='Não foi possível publicar ('+((e&&e.code)||'erro')+'). '+(e&&e.code==='quota_exceeded'?'O limite de documentos foi atingido; apague o inventário anterior.':'Tente de novo.');
  }
  if(S.imp)S.imp.busy=false;
  draw(true);
}

    const cur={...((S.gstat&&S.gstat.inv===S.meta.inv&&S.gstat.excl)||{})};
    if(v)cur[k]={n,t:Date.now()};else delete cur[k];

root.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b||!root.contains(b))return;const f=ACT[b.dataset.act];if(f)f(b,e)});
root.addEventListener('change',e=>{const t=e.target.closest('[data-chg]');if(!t)return;const f=CHG[t.dataset.chg];if(f)f(t,e)});
root.addEventListener('input',e=>{
  const t=e.target.closest('[data-inp]');if(!t)return;const k=t.dataset.inp;
  if(k==='iname'&&S.imp)S.imp.name=t.value;
  else if(k==='gq'){S.q.gq=t.value;$('#grp-list').innerHTML=gGroupList()}
  else if(k==='gp'){S.q.gp=t.value;gRefresh()}
  else if(k==='igq'&&S.imp){S.imp.gq=t.value;const l=$('#ig-list');if(l)l.innerHTML=igList(S.imp)}
  else if(k==='lsq'){S.q.lsq=t.value;const bd=$('#lsum-body');if(bd)bd.innerHTML=lsBody(lsData())}
  else if(k==='rq'){S.q.rq=t.value;$('#rel-body').innerHTML=relBody(knownOps())}
  else if(k==='lq'){S.q.lq=t.value;$('#loc-body').innerHTML=locBody(knownOps())}
  else if(k==='apq'){S.q.apq=t.value;$('#apur-body').innerHTML=apBody(apRows())}
  else if(k==='adlq'){S.q.adlq=t.value;S.adlmax=100;adListRefresh()}
  else if(k==='adgq'){S.q.adgq=t.value;const b=$('#adg-body');if(b)b.innerHTML=adGroupsBody()}
  else if(k==='aq'){S.q.aq=t.value;adRender(true)}
  else if(k==='cq'){S.q.cq=t.value;qRender()}
  else if(k==='eq'){S.q.eq=t.value;$('#end-body').innerHTML=endBody()}
  else if(k==='bq'){S.q.bq=t.value;$('#busca-body').innerHTML=bBody()}
  else if(k==='qctrl'){S.q.ctrl=t.value;$('#ctrl-body').innerHTML=ctrlTableRows(ctrlItems().map(ctrlRow))}
  else if(k==='qitens'){S.q.itens=t.value;$('#itens-body').innerHTML=itensRows()}
  else if(k==='qdiv'){S.q.div=t.value;$('#div-body').innerHTML=divRows()}
  else if(k==='qaud'){S.q.aud=t.value;$('#aud-body').innerHTML=audRows()}
});
root.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='blcode'){e.preventDefault();blSearch();return}if(e.key==='Enter'&&e.target.id==='blqty'){e.preventDefault();const b=$('[data-act="bladd"]');if(b)b.click();return}if(e.key==='Enter'&&e.target.dataset&&e.target.dataset.adin!=null){const b=e.target.closest('[data-ad]').querySelector('[data-act="adsave"]');if(b)b.click();return}if(e.key==='Enter'&&e.target.id&&e.target.id.startsWith('fin-')){const b=e.target.parentElement.querySelector('[data-act="setfinal"]');if(b)b.click()}});

gLoad();
